<!DOCTYPE html>
<html>
<head>
  <title>Web Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #0d0d1a; color: #eee; font-family: monospace; }
    #sidebar { width: 160px; padding: 1rem; display: flex; flex-direction: column;
               gap: 0.25rem; border-right: 1px solid #2a2a4a; overflow-y: auto; }
    #sidebar h3 { font-size: 0.7rem; color: #666; text-transform: uppercase;
                  letter-spacing: 0.1em; margin: 0.75rem 0 0.25rem; }
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #tabs { display: flex; gap: 2px; padding: 0.4rem 0.5rem;
            background: #111; border-bottom: 1px solid #2a2a4a; }
    #frames { flex: 1; position: relative; }
    #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%;
                     border: none; background: #000; display: none; }
    #frames iframe.active { display: block; }
    .server-btn { background: none; border: 1px solid #333; color: #aaa;
                  padding: 0.35rem 0.6rem; cursor: pointer; text-align: left;
                  font-family: monospace; font-size: 0.85rem; width: 100%; }
    .server-btn.active, .server-btn:hover { background: #1a1a3a; color: #eee; border-color: #555; }
    .tab-btn { background: none; border: 1px solid #333; color: #aaa;
               padding: 0.3rem 0.8rem; cursor: pointer; font-family: monospace; font-size: 0.8rem; }
    .tab-btn.active { background: #2a2a5a; color: #fff; border-color: #66f; }
    .tab-btn:hover { background: #1a1a3a; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div style="font-size:1rem;font-weight:bold;color:#88f;margin-bottom:0.5rem">Terminal</div>
    <div id="server-list"></div>
  </div>
  <div id="main">
    <div id="tabs"></div>
    <div id="frames"></div>
  </div>
  <script>
    const state = {
      servers: [],
      activeServer: null,
      activeFrameByServer: {},
    };

    function slug(value) {
      return String(value).replace(/[^a-zA-Z0-9_-]/g, '-');
    }

    function frameIdFor(server, panel) {
      return `frame-${slug(server.name)}-${slug(panel.label)}-${panel.port}`;
    }

    function resolveHost(host) {
      if (!host || host === '127.0.0.1' || host === 'localhost' || host === '::1') {
        return window.location.hostname;
      }
      return host;
    }

    function ensureFrame(server, panel) {
      const framesEl = document.getElementById('frames');
      const id = frameIdFor(server, panel);
      const existing = document.getElementById(id);
      if (existing) return existing;

      const path = panel.path || '/';
      const protocol = panel.protocol || window.location.protocol.replace(':', '');
      const host = resolveHost(server.ip);

      const iframe = document.createElement('iframe');
      iframe.id = id;
      iframe.src = `${protocol}://${host}:${panel.port}${path}`;
      framesEl.appendChild(iframe);
      return iframe;
    }

    function activateFrame(frameId) {
      document.querySelectorAll('#frames iframe').forEach(f => f.classList.remove('active'));
      const frame = document.getElementById(frameId);
      if (frame) frame.classList.add('active');
    }

    function selectServer(server) {
      state.activeServer = server.name;
      renderSidebar();
      renderTabs(server);
    }

    function renderSidebar() {
      const list = document.getElementById('server-list');
      list.innerHTML = '';
      state.servers.forEach(server => {
        const heading = document.createElement('h3');
        heading.textContent = server.name;
        list.appendChild(heading);

        const btn = document.createElement('button');
        btn.className = 'server-btn' + (server.name === state.activeServer ? ' active' : '');
        btn.textContent = server.name;
        btn.onclick = () => selectServer(server);
        list.appendChild(btn);
      });
    }

    function renderTabs(server) {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';

      if (!server.panels || server.panels.length === 0) {
        activateFrame('');
        return;
      }

      const savedFrameId = state.activeFrameByServer[server.name];
      let selectedFrameId = null;

      server.panels.forEach((panel, i) => {
        const frame = ensureFrame(server, panel);
        const frameId = frame.id;
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.textContent = panel.label;
        btn.onclick = () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.activeFrameByServer[server.name] = frameId;
          activateFrame(frameId);
        };
        tabs.appendChild(btn);

        if ((savedFrameId && savedFrameId === frameId) || (!savedFrameId && i === 0)) {
          selectedFrameId = frameId;
          btn.classList.add('active');
        }
      });

      if (!selectedFrameId) {
        selectedFrameId = frameIdFor(server, server.panels[0]);
      }

      state.activeFrameByServer[server.name] = selectedFrameId;
      activateFrame(selectedFrameId);
    }

    async function init() {
      state.servers = await fetch('/servers').then(r => r.json());
      if (state.servers.length === 0) {
        renderSidebar();
        return;
      }

      const existing = state.servers.find(s => s.name === state.activeServer);
      const target = existing || state.servers[0];
      selectServer(target);
    }

    init();
  </script>
</body>
</html>
