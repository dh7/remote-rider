<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RR">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <title>Remote Rider</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title">RR</div>
      <div id="sidebar-actions">
        <button id="send-keys-btn" title="Toggle terminal keys">⌨</button>
        <button id="fullscreen-btn" title="Toggle fullscreen">⛶</button>
        <button id="update-remotes-btn" title="Update all remotes">Update</button>
        <button id="new-sandbox-btn" title="New sandbox workspace">⬡</button>
        <button id="add-session-btn" title="Add workspace">+</button>
      </div>
    </div>
    <div id="session-list"></div>
    <div id="keys-panel" class="hidden">
      <div id="keys-target" class="muted-note"></div>
      <div id="keys-grid"></div>
      <div id="keys-flash" class="muted-note"></div>
    </div>
  </div>
  <div id="main">
    <div id="tabs"></div>
    <div id="frames"></div>
  </div>

  <div id="add-modal">
    <div id="add-card">
      <h2>Add Workspace</h2>

      <div class="section-card">
        <div class="section-head"><h3>Workspace config</h3></div>
        <div class="form-row">
          <label for="add-label">Workspace Label</label>
          <input id="add-label" type="text" placeholder="netochka">
        </div>

        <div class="form-row normal-workspace-field">
          <label for="add-server-select">Machine</label>
          <select id="add-server-select"></select>
        </div>

        <div class="form-row normal-workspace-field">
          <label for="add-project-path">Project Path</label>
          <input id="add-project-path" type="text" placeholder="/home/dh/code/project">
        </div>

        <div id="add-new-server-wrap" class="inline-row hidden normal-workspace-field">
          <div class="form-row">
            <label for="add-server-ip">Machine IP/Host</label>
            <input id="add-server-ip" type="text" placeholder="100.x.x.x or hostname">
          </div>
        </div>

        <div id="add-known-server-wrap" class="form-row hidden normal-workspace-field">
          <label for="add-known-server">Homelab server (Tailscale)</label>
          <select id="add-known-server"></select>
        </div>

        <div class="form-row">
          <label for="add-workspace-type">Workspace Type</label>
          <select id="add-workspace-type">
            <option value="normal">Normal workspace</option>
            <option value="sandbox">Sandbox workspace</option>
          </select>
        </div>
      </div>

      <div class="section-card normal-workspace-field">
        <div class="section-head"><h3>Tabs</h3></div>
        <div id="add-tab-options" class="checkbox-stack"></div>
      </div>

      <div class="section-card normal-workspace-field">
        <div class="section-head"><h3>Terminal</h3></div>
        <div class="form-row">
          <label>Terminal tmux Session</label>
          <div class="radio-row">
            <label><input type="radio" name="tmux-source" value="existing" checked> Existing</label>
            <label><input type="radio" name="tmux-source" value="new"> New</label>
          </div>
        </div>

        <div id="add-existing-wrap" class="form-row">
          <label for="add-existing-session">Existing tmux session</label>
          <select id="add-existing-session"></select>
        </div>

        <div id="add-new-session-wrap" class="form-row hidden">
          <label for="add-new-session">New tmux session name</label>
          <input id="add-new-session" type="text" placeholder="job1">
        </div>

      </div>

      <div id="add-actions">
        <button id="add-cancel" class="secondary-btn" type="button">Cancel</button>
        <button id="add-submit" class="primary-btn" type="button">Create Workspace</button>
      </div>
    </div>
  </div>

  <div id="panel-modal">
    <div id="panel-card">
      <h2>Workspace Setup</h2>
      <div id="panel-target" class="muted-note"></div>
      <div class="section-card">
        <div class="section-head"><h3>Workspace</h3></div>
        <div class="inline-row">
          <div class="form-row">
            <label for="panel-session-label">Label</label>
            <input id="panel-session-label" type="text" placeholder="Workspace label">
          </div>
          <div class="form-row">
            <label for="panel-session-color">Color</label>
            <input id="panel-session-color" type="color">
          </div>
        </div>
      </div>
      <div class="section-card">
        <div class="section-head">
          <h3>Workspace Tabs</h3>
        </div>
        <div id="panel-list"></div>
      </div>
      <div class="section-card">
        <div class="section-head">
          <h3>Remote Services</h3>
          <button id="panel-refresh-services" class="secondary-btn" type="button">Refresh</button>
        </div>
        <div id="panel-services-note" class="muted-note"></div>
        <div id="panel-services" class="service-list"></div>
      </div>
      <div id="panel-actions-row">
        <button id="panel-add" class="secondary-btn" type="button">Add Custom Tab</button>
        <button id="panel-sync" class="secondary-btn" type="button">Sync Tabs From Remote</button>
        <button id="panel-launch-files" class="secondary-btn" type="button">Launch Files Service</button>
      </div>
      <div id="panel-actions">
        <div id="panel-danger">
          <button id="panel-delete" class="danger-btn" type="button">Delete</button>
          <button id="panel-kill" class="danger-btn" type="button">Delete + Kill tmux</button>
        </div>
        <div id="panel-confirm">
          <button id="panel-cancel" class="secondary-btn" type="button">Cancel</button>
          <button id="panel-save" class="primary-btn" type="button">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div id="sandbox-modal">
    <div id="sandbox-card">
      <h2>Sandbox Workspace</h2>

      <div id="sandbox-running-wrap" class="section-card hidden">
        <div class="section-head"><h3>Running Sandboxes</h3></div>
        <div id="sandbox-running-list" class="service-list"></div>
      </div>

      <div class="section-card">
        <div class="section-head"><h3>Create New</h3></div>
        <div class="form-row">
          <label for="sandbox-machine">Target Machine</label>
          <select id="sandbox-machine"></select>
        </div>
        <div class="form-row">
          <label>Repo Source</label>
          <div class="radio-row">
            <label><input type="radio" name="sandbox-source" value="path" checked> Copy from machine</label>
            <label><input type="radio" name="sandbox-source" value="github"> Clone from GitHub</label>
          </div>
        </div>
        <div id="sandbox-path-wrap" class="form-row">
          <label for="sandbox-local-path">Repo path on target machine</label>
          <input id="sandbox-local-path" type="text" placeholder="/home/user/my-project">
        </div>
        <div id="sandbox-github-wrap" class="hidden">
          <div class="inline-row">
            <div class="form-row">
              <label for="sandbox-github-user">GitHub user</label>
              <input id="sandbox-github-user" type="text" placeholder="username">
            </div>
            <div class="form-row" style="justify-content:flex-end;">
              <label>&nbsp;</label>
              <button id="sandbox-fetch-repos" class="secondary-btn" type="button">Fetch repos</button>
            </div>
          </div>
          <div class="form-row">
            <label for="sandbox-repo">Repository</label>
            <div class="repo-combo">
              <input id="sandbox-repo" type="text" placeholder="https://github.com/user/repo.git" autocomplete="off">
              <div id="sandbox-repo-suggestions" class="repo-suggestions hidden"></div>
            </div>
          </div>
        </div>
        <div class="form-row">
          <label for="sandbox-branch">Feature Branch</label>
          <input id="sandbox-branch" type="text" placeholder="feature/my-feature">
        </div>
        <div id="sandbox-existing-wrap" class="form-row hidden">
          <label for="sandbox-clone-from">Clone from existing sandbox instead</label>
          <select id="sandbox-clone-from"></select>
        </div>
      </div>

      <div id="sandbox-status" class="muted-note"></div>
      <div id="sandbox-actions">
        <button id="sandbox-cancel" class="secondary-btn" type="button">Cancel</button>
        <button id="sandbox-submit" class="primary-btn" type="button">Create Workspace</button>
      </div>
    </div>
  </div>

  <div id="update-modal">
    <div id="update-card">
      <h2>Remote Update Status</h2>
      <div id="update-branch-note" class="muted-note"></div>
      <div id="update-machine-list"></div>
      <div id="update-actions">
        <button id="update-close" class="secondary-btn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
