<!DOCTYPE html>
<html>
<head>
  <title>Web Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #0d0d1a; color: #eee; font-family: monospace; }

    #sidebar {
      width: 280px;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
      background: #0c0c16;
    }

    #sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }

    #sidebar-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #88f;
      letter-spacing: 0.03em;
    }

    #add-session-btn {
      background: #29406c;
      border: 1px solid #45629a;
      color: #fff;
      width: 1.8rem;
      height: 1.8rem;
      border-radius: 0.3rem;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1rem;
    }

    .session-row {
      border: 1px solid #30344f;
      border-radius: 0.4rem;
      padding: 0.3rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.3rem;
      background: #111327;
    }

    .session-row.dragging { opacity: 0.45; }
    .session-row.drop-before { box-shadow: inset 0 3px 0 0 #6aa0ff; }
    .session-row.drop-after { box-shadow: inset 0 -3px 0 0 #6aa0ff; }

    .session-main {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
      cursor: pointer;
      border: none;
      background: none;
      color: #ddd;
      text-align: left;
      width: 100%;
      padding: 0.2rem;
      border-radius: 0.25rem;
    }

    .session-main:hover,
    .session-main.active {
      background: #1a1f3e;
      color: #fff;
    }

    .session-dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      flex: 0 0 auto;
      border: 1px solid #111;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .session-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 0.1rem;
    }

    .session-label {
      font-size: 0.83rem;
      color: #f0f0f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-meta {
      font-size: 0.68rem;
      color: #888ca8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-actions {
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .icon-btn {
      background: #17192b;
      border: 1px solid #3b4060;
      color: #c4c8e5;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 0.25rem;
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 0.8rem;
    }

    .drag-handle {
      cursor: grab;
      font-size: 0.72rem;
      letter-spacing: -1px;
    }

    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #tabs {
      display: flex;
      gap: 2px;
      padding: 0.4rem 0.5rem;
      background: #111;
      border-bottom: 1px solid #2a2a4a;
      align-items: center;
    }
    #add-tab-btn {
      margin-left: auto;
      background: #1a2137;
      border: 1px solid #4c5a86;
      color: #dbe4ff;
      width: 1.7rem;
      height: 1.5rem;
      border-radius: 0.25rem;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.95rem;
      line-height: 0.9rem;
    }
    #frames { flex: 1; position: relative; }
    #frames iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      display: none;
    }
    #frames iframe.active { display: block; }

    .tab-btn {
      background: none;
      border: 1px solid #333;
      color: #aaa;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .tab-btn.active { background: #2a2a5a; color: #fff; border-color: #66f; }
    .tab-btn:hover { background: #1a1a3a; }
    .tab-dot {
      width: 0.48rem;
      height: 0.48rem;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0, 0, 0, 0.45);
    }
    .tab-dot.unknown { background: #7d85a4; }
    .tab-dot.up { background: #5bc16f; }
    .tab-dot.down { background: #d35d5d; }

    #add-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 8, 14, 0.72);
      z-index: 20;
      padding: 1rem;
    }
    #add-modal.open { display: flex; }
    #add-card {
      width: min(36rem, 100%);
      background: #121628;
      border: 1px solid #394160;
      border-radius: 0.6rem;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    #add-card h2 {
      font-size: 0.95rem;
      color: #d7defa;
      font-weight: bold;
    }
    .form-row { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-row label { font-size: 0.74rem; color: #9aa4cc; }
    .form-row select,
    .form-row input {
      background: #161c2f;
      border: 1px solid #414d77;
      color: #eff3ff;
      padding: 0.45rem 0.52rem;
      border-radius: 0.3rem;
      font-family: monospace;
    }
    .inline-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .radio-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.78rem;
      color: #c5ccee;
    }
    #add-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.2rem;
    }
    .secondary-btn {
      background: #1a2137;
      border: 1px solid #4c5a86;
      color: #dbe4ff;
      padding: 0.45rem 0.8rem;
      border-radius: 0.3rem;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.82rem;
    }
    .primary-btn {
      background: #32518f;
      border: 1px solid #5278c8;
      color: #fff;
      padding: 0.45rem 0.8rem;
      border-radius: 0.3rem;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.82rem;
    }
    #panel-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 8, 14, 0.72);
      z-index: 25;
      padding: 1rem;
    }
    #panel-modal.open { display: flex; }
    #panel-card {
      width: min(52rem, 100%);
      max-height: 85vh;
      overflow: auto;
      background: #121628;
      border: 1px solid #394160;
      border-radius: 0.6rem;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    #panel-card h2 {
      font-size: 0.95rem;
      color: #d7defa;
      font-weight: bold;
    }
    .panel-row {
      display: grid;
      grid-template-columns: 1.2fr 0.7fr 1.2fr 0.8fr auto;
      gap: 0.45rem;
      margin-bottom: 0.4rem;
    }
    .panel-row input,
    .panel-row select {
      background: #161c2f;
      border: 1px solid #414d77;
      color: #eff3ff;
      padding: 0.45rem 0.52rem;
      border-radius: 0.3rem;
      font-family: monospace;
      min-width: 0;
    }
    #panel-actions-row,
    #panel-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }
    @media (max-width: 900px) {
      #sidebar { width: 220px; }
      .panel-row { grid-template-columns: 1fr 1fr; }
    }
    .muted-note { font-size: 0.72rem; color: #8f97b9; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title">Sessions</div>
      <button id="add-session-btn" title="Add session">+</button>
    </div>
    <div id="server-list"></div>
  </div>
  <div id="main">
    <div id="tabs"></div>
    <div id="frames"></div>
  </div>

  <div id="add-modal">
    <div id="add-card">
      <h2>Add Session</h2>

      <div class="form-row">
        <label for="add-server-select">Server Profile</label>
        <select id="add-server-select"></select>
      </div>

      <div id="add-new-server-wrap" class="inline-row hidden">
        <div class="form-row">
          <label for="add-server-ip">New Server IP/Host</label>
          <input id="add-server-ip" type="text" placeholder="100.x.x.x or hostname">
        </div>
      </div>

      <div id="add-template-wrap" class="form-row">
        <label for="add-template-select">Panel Template</label>
        <select id="add-template-select"></select>
      </div>

      <div class="form-row">
        <label for="add-panel-source">Panel Source</label>
        <select id="add-panel-source"></select>
      </div>

      <div id="add-source-profile-wrap" class="form-row">
        <label for="add-source-profile">Source Profile</label>
        <select id="add-source-profile"></select>
      </div>

      <div id="add-known-server-wrap" class="form-row hidden">
        <label for="add-known-server">Homelab server (Tailscale)</label>
        <select id="add-known-server"></select>
      </div>

      <div class="form-row">
        <label for="add-label">Session Label (left menu)</label>
        <input id="add-label" type="text" placeholder="netochka">
      </div>

      <div class="form-row">
        <label>Terminal Session</label>
        <div class="radio-row">
          <label><input type="radio" name="tmux-source" value="existing" checked> Existing</label>
          <label><input type="radio" name="tmux-source" value="new"> New</label>
        </div>
      </div>

      <div id="add-existing-wrap" class="form-row">
        <label for="add-existing-session">Existing tmux session</label>
        <select id="add-existing-session"></select>
      </div>

      <div id="add-new-session-wrap" class="form-row hidden">
        <label for="add-new-session">New tmux session name</label>
        <input id="add-new-session" type="text" placeholder="job1">
      </div>

      <div id="add-note" class="muted-note"></div>

      <div id="add-actions">
        <button id="add-cancel" class="secondary-btn" type="button">Cancel</button>
        <button id="add-submit" class="primary-btn" type="button">Create Session</button>
      </div>
    </div>
  </div>

  <div id="panel-modal">
    <div id="panel-card">
      <h2>Session Setup</h2>
      <div id="panel-target" class="muted-note"></div>
      <div id="panel-list"></div>
      <div id="panel-actions-row">
        <button id="panel-add" class="secondary-btn" type="button">Add Panel</button>
        <button id="panel-sync" class="secondary-btn" type="button">Sync From Remote</button>
        <button id="panel-launch-files" class="secondary-btn" type="button">Launch Files Service</button>
      </div>
      <div id="panel-actions">
        <button id="panel-cancel" class="secondary-btn" type="button">Cancel</button>
        <button id="panel-save" class="primary-btn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script>
    const UI_KEY = 'webterm-ui-state-v2';
    const PROFILES_KEY = 'webterm-profiles-v2';

    const HOMELAB_SERVERS = [
      { name: 'netochka', ip: '100.119.43.10', aliases: ['netochka-01', 'netoska'] },
      { name: 'gx10', ip: '100.118.187.64', aliases: ['gx10-dab6', 'spark'] },
      { name: 'image-store', ip: '100.118.221.26', aliases: [] },
      { name: 'hermes', ip: '100.69.53.14', aliases: [] },
      { name: 'tailscale', ip: '100.89.14.119', aliases: [] },
      { name: 'dh7-syno-01', ip: '100.107.84.55', aliases: ['synology'] },
    ];

    const state = {
      servers: [],
      activeServer: null,
      activeTabByServer: {},
      tmuxSessions: [],
      templates: [],
      panelEditor: null,
    };

    const addModal = document.getElementById('add-modal');
    const addServerSelect = document.getElementById('add-server-select');
    const addNewServerWrap = document.getElementById('add-new-server-wrap');
    const addKnownServerWrap = document.getElementById('add-known-server-wrap');
    const addKnownServer = document.getElementById('add-known-server');
    const addServerIp = document.getElementById('add-server-ip');
    const addTemplateWrap = document.getElementById('add-template-wrap');
    const addTemplateSelect = document.getElementById('add-template-select');
    const addPanelSource = document.getElementById('add-panel-source');
    const addSourceProfileWrap = document.getElementById('add-source-profile-wrap');
    const addSourceProfile = document.getElementById('add-source-profile');
    const addLabel = document.getElementById('add-label');
    const addExistingWrap = document.getElementById('add-existing-wrap');
    const addExistingSession = document.getElementById('add-existing-session');
    const addNewSessionWrap = document.getElementById('add-new-session-wrap');
    const addNewSession = document.getElementById('add-new-session');
    const addNote = document.getElementById('add-note');
    const panelModal = document.getElementById('panel-modal');
    const panelTarget = document.getElementById('panel-target');
    const panelList = document.getElementById('panel-list');

    function loadUIState() {
      try {
        const raw = localStorage.getItem(UI_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          if (typeof parsed.activeServer === 'string') state.activeServer = parsed.activeServer;
          if (parsed.activeTabByServer && typeof parsed.activeTabByServer === 'object') {
            state.activeTabByServer = parsed.activeTabByServer;
          }
        }
      } catch (_) {}
    }

    function saveUIState() {
      try {
        localStorage.setItem(UI_KEY, JSON.stringify({
          activeServer: state.activeServer,
          activeTabByServer: state.activeTabByServer,
        }));
      } catch (_) {}
    }

    function saveProfiles() {
      try {
        localStorage.setItem(PROFILES_KEY, JSON.stringify(state.servers));
      } catch (_) {}
    }

    function normalizeProfile(raw) {
      if (!raw || typeof raw !== 'object') return null;
      if (!raw.name || !Array.isArray(raw.panels)) return null;
      return {
        name: String(raw.name),
        display: raw.display ? String(raw.display) : undefined,
        ip: raw.ip ? String(raw.ip) : '127.0.0.1',
        panels: raw.panels.map((p) => ({
          label: String(p.label || ''),
          port: Number(p.port || 0),
          path: p.path ? String(p.path) : undefined,
          protocol: p.protocol ? String(p.protocol) : undefined,
        })).filter((p) => p.label && p.port),
      };
    }

    async function loadProfilesFromBootstrap() {
      const bootstrap = await fetch('/servers').then((r) => r.json()).catch(() => []);
      const fromBootstrap = Array.isArray(bootstrap)
        ? bootstrap.map(normalizeProfile).filter(Boolean)
        : [];

      try {
        const raw = localStorage.getItem(PROFILES_KEY);
        if (!raw) {
          state.servers = fromBootstrap;
          saveProfiles();
          return;
        }
        const parsed = JSON.parse(raw);
        const localProfiles = Array.isArray(parsed) ? parsed.map(normalizeProfile).filter(Boolean) : [];
        state.servers = localProfiles.length ? localProfiles : fromBootstrap;
      } catch (_) {
        state.servers = fromBootstrap;
      }
    }

    function slug(value) {
      return String(value).replace(/[^a-zA-Z0-9_-]/g, '-');
    }

    function makeUniqueName(base) {
      const cleaned = String(base || 'session').toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '') || 'session';
      const names = new Set(state.servers.map((s) => s.name));
      if (!names.has(cleaned)) return cleaned;
      let i = 2;
      while (names.has(`${cleaned}-${i}`)) i += 1;
      return `${cleaned}-${i}`;
    }

    function displayName(server) {
      return server.display || server.name;
    }

    function frameIdFor(server, panel) {
      return `frame-${slug(server.name)}-${slug(panel.label)}-${panel.port}`;
    }

    function resolveHost(host) {
      if (!host || host === '127.0.0.1' || host === 'localhost' || host === '::1') return window.location.hostname;
      return host;
    }

    function isLocalHost(host) {
      return !host || host === '127.0.0.1' || host === 'localhost' || host === '::1';
    }

    function homelabIpForName(text) {
      const key = String(text || '').trim().toLowerCase();
      if (!key) return '';
      const keyTokens = key.split(/[^a-z0-9._-]+/).filter(Boolean);
      for (const server of HOMELAB_SERVERS) {
        const names = [server.name, ...(server.aliases || [])].map((x) => x.toLowerCase());
        if (server.ip === key) return server.ip;
        if (names.includes(key)) return server.ip;
        if (names.some((n) => key.includes(n))) return server.ip;
        if (keyTokens.some((tok) => names.includes(tok))) return server.ip;
      }
      return '';
    }

    function profileNetworkHost(server) {
      const mapped = homelabIpForName(displayName(server)) || homelabIpForName(server.name);
      if (isLocalHost(server.ip) && mapped) return mapped;
      return server.ip || mapped || '';
    }

    async function probePanelStatus(server, panel) {
      const host = profileNetworkHost(server) || server.ip || '127.0.0.1';
      const query = new URLSearchParams({ host, port: String(panel.port), timeout_ms: '650' }).toString();
      try {
        const payload = await fetch(`/panel/status?${query}`).then((r) => r.json());
        return {
          up: Boolean(payload.up),
          latency: Number(payload.latency_ms || 0),
          error: payload.error ? String(payload.error) : '',
          host,
        };
      } catch (err) {
        return { up: false, latency: 0, error: String(err.message || err), host };
      }
    }

    function colorForServer(server) {
      const key = `${profileNetworkHost(server) || server.ip || ''}`;
      let hash = 0;
      for (let i = 0; i < key.length; i += 1) hash = ((hash << 5) - hash) + key.charCodeAt(i);
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue} 65% 55%)`;
    }

    function terminalSessionForServer(server) {
      const terminal = (server.panels || []).find((p) => p.label === 'Terminal');
      if (!terminal || !terminal.path) return '1';
      const idx = terminal.path.indexOf('?');
      if (idx < 0) return '1';
      const params = new URLSearchParams(terminal.path.slice(idx + 1));
      return params.get('arg') || '1';
    }

    function sanitizeSessionName(raw) {
      const cleaned = String(raw || '').trim().replace(/[^A-Za-z0-9._:-]+/g, '-');
      return cleaned || '1';
    }

    function clonePanels(source) {
      return (source.panels || []).map((p) => ({ ...p }));
    }

    function normalizePanels(panels) {
      if (!Array.isArray(panels)) return [];
      return panels
        .map((p) => ({
          label: String(p.label || ''),
          port: Number(p.port || 0),
          path: p.path ? String(p.path) : undefined,
          protocol: p.protocol ? String(p.protocol) : undefined,
        }))
        .filter((p) => p.label && p.port > 0);
    }

    function defaultTemplates() {
      return [
        {
          id: 'standard',
          label: 'Standard',
          panels: [
            { label: 'Terminal', port: 7681 },
            { label: 'Monitor', port: 8001 },
            { label: 'Logs', port: 8002 },
            { label: 'Files', port: 8080, path: '/files' },
          ],
        },
      ];
    }

    async function loadSessionTemplates() {
      try {
        const payload = await fetch('/session-templates').then((r) => r.json());
        if (!Array.isArray(payload) || !payload.length) {
          state.templates = defaultTemplates();
          return;
        }
        state.templates = payload.map((item) => ({
          id: String(item.id || ''),
          label: String(item.label || item.id || 'Template'),
          panels: normalizePanels(item.panels || []),
        })).filter((item) => item.id && item.panels.length);
        if (!state.templates.length) state.templates = defaultTemplates();
      } catch (_) {
        state.templates = defaultTemplates();
      }
    }

    async function fetchServerPanels(host) {
      const query = new URLSearchParams({ host: host || '127.0.0.1', port: '7000' }).toString();
      try {
        const payload = await fetch(`/servers/proxy?${query}`).then((r) => r.json());
        if (!payload.ok || !Array.isArray(payload.servers) || !payload.servers.length) {
          return null;
        }
        const first = payload.servers[0];
        return normalizePanels(first.panels || []);
      } catch (_) {
        return null;
      }
    }

    function setTerminalSession(profile, session) {
      const terminal = (profile.panels || []).find((p) => p.label === 'Terminal');
      if (!terminal) return;
      if (session === '1') {
        delete terminal.path;
      } else {
        terminal.path = `/?arg=${encodeURIComponent(session)}`;
      }
    }

    function ensureFrame(server, panel) {
      const framesEl = document.getElementById('frames');
      const id = frameIdFor(server, panel);
      const existing = document.getElementById(id);
      if (existing) return existing;

      const path = panel.path || '/';
      const protocol = panel.protocol || window.location.protocol.replace(':', '');
      const host = resolveHost(server.ip);

      const iframe = document.createElement('iframe');
      iframe.id = id;
      iframe.src = `${protocol}://${host}:${panel.port}${path}`;
      framesEl.appendChild(iframe);
      return iframe;
    }

    function activateFrame(frameId) {
      document.querySelectorAll('#frames iframe').forEach((f) => f.classList.remove('active'));
      const frame = document.getElementById(frameId);
      if (frame) frame.classList.add('active');
    }

    function selectServer(server) {
      state.activeServer = server.name;
      saveUIState();
      renderSidebar();
      renderTabs(server);
    }

    function reloadServers(preferredName) {
      renderSidebar();
      if (!state.servers.length) {
        activateFrame('');
        return;
      }
      const target = state.servers.find((s) => s.name === preferredName)
        || state.servers.find((s) => s.name === state.activeServer)
        || state.servers[0];
      selectServer(target);
    }

    async function deleteSession(server) {
      if (!confirm(`Delete session "${displayName(server)}"?`)) return;
      state.servers = state.servers.filter((s) => s.name !== server.name);
      saveProfiles();
      const fallback = state.activeServer === server.name ? null : state.activeServer;
      reloadServers(fallback);
    }

    async function deleteSessionAndKill(server) {
      const session = terminalSessionForServer(server);
      const host = profileNetworkHost(server) || server.ip;
      const ok = confirm(
        `Delete profile "${displayName(server)}" and try to kill tmux session "${session}" on ${host}?\n\n` +
        `This can stop running terminal tasks.`
      );
      if (!ok) return;

      try {
        const res = await fetch('/tmux/kill', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ host, session, port: 7000 }),
        }).then((r) => r.json());
        const status = res.status || 'unknown';
        if (status === 'killed') alert(`tmux session "${session}" killed on ${host}.`);
        else if (status === 'not_found') alert(`tmux session "${session}" not found on ${host}.`);
        else if (status === 'skipped') alert(`tmux kill skipped: ${res.reason || 'unknown'}`);
        else if (status === 'error') alert(`tmux kill error: ${res.reason || 'unknown'}`);
      } catch (err) {
        alert(`tmux kill request failed: ${err.message}`);
      }

      state.servers = state.servers.filter((s) => s.name !== server.name);
      saveProfiles();
      const fallback = state.activeServer === server.name ? null : state.activeServer;
      reloadServers(fallback);
    }

    async function renameSession(server) {
      const label = prompt('Session label in left menu:', displayName(server));
      if (label === null) return;
      server.display = label.trim() || server.name;
      saveProfiles();
      renderSidebar();
    }

    function renderPanelEditorRows() {
      const rows = (state.panelEditor && state.panelEditor.panels) ? state.panelEditor.panels : [];
      panelList.innerHTML = '';
      rows.forEach((panel, idx) => {
        const row = document.createElement('div');
        row.className = 'panel-row';

        const label = document.createElement('input');
        label.type = 'text';
        label.value = panel.label || '';
        label.placeholder = 'Label';
        label.oninput = () => { panel.label = label.value; };

        const port = document.createElement('input');
        port.type = 'number';
        port.min = '1';
        port.max = '65535';
        port.value = String(panel.port || '');
        port.placeholder = 'Port';
        port.oninput = () => { panel.port = Number(port.value || 0); };

        const path = document.createElement('input');
        path.type = 'text';
        path.value = panel.path || '';
        path.placeholder = '/path';
        path.oninput = () => { panel.path = path.value; };

        const protocol = document.createElement('select');
        const p1 = document.createElement('option');
        p1.value = 'http';
        p1.textContent = 'http';
        const p2 = document.createElement('option');
        p2.value = 'https';
        p2.textContent = 'https';
        protocol.appendChild(p1);
        protocol.appendChild(p2);
        protocol.value = panel.protocol || 'http';
        protocol.onchange = () => { panel.protocol = protocol.value; };

        const del = document.createElement('button');
        del.className = 'icon-btn';
        del.textContent = 'X';
        del.title = 'Remove panel';
        del.onclick = () => {
          state.panelEditor.panels.splice(idx, 1);
          renderPanelEditorRows();
        };

        row.appendChild(label);
        row.appendChild(port);
        row.appendChild(path);
        row.appendChild(protocol);
        row.appendChild(del);
        panelList.appendChild(row);
      });
    }

    function openPanelModal(server) {
      state.panelEditor = {
        name: server.name,
        panels: normalizePanels(clonePanels(server)),
      };
      panelTarget.textContent = `${displayName(server)} (${profileNetworkHost(server) || server.ip || 'unknown-host'})`;
      renderPanelEditorRows();
      panelModal.classList.add('open');
    }

    function closePanelModal() {
      panelModal.classList.remove('open');
      state.panelEditor = null;
    }

    async function syncPanelEditorFromRemote() {
      if (!state.panelEditor) return;
      const server = state.servers.find((s) => s.name === state.panelEditor.name);
      if (!server) return;
      const host = profileNetworkHost(server) || server.ip;
      const remotePanels = await fetchServerPanels(host);
      if (!remotePanels || !remotePanels.length) {
        alert(`Could not fetch remote panels from ${host}.`);
        return;
      }
      const session = terminalSessionForServer(server);
      state.panelEditor.panels = normalizePanels(remotePanels);
      const tempProfile = { panels: state.panelEditor.panels };
      setTerminalSession(tempProfile, session);
      renderPanelEditorRows();
    }

    async function launchFilesServiceFromPanelEditor() {
      if (!state.panelEditor) return;
      const server = state.servers.find((s) => s.name === state.panelEditor.name);
      if (!server) return;

      const host = profileNetworkHost(server) || server.ip || '127.0.0.1';
      const rawPort = prompt('Start fileserver on port (blank = auto pick):', '');
      if (rawPort === null) return;

      let requestedPort = null;
      if (rawPort.trim()) {
        const parsed = Number(rawPort.trim());
        if (!Number.isInteger(parsed) || parsed < 1 || parsed > 65535) {
          alert('Invalid port. Use a number between 1 and 65535.');
          return;
        }
        requestedPort = parsed;
      }

      const payload = {
        host,
        hub_port: 7000,
        port: requestedPort,
      };

      let res;
      try {
        res = await fetch('/services/files/start/proxy', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload),
        }).then((r) => r.json());
      } catch (err) {
        alert(`Failed to start files service: ${err.message}`);
        return;
      }

      if (!res || res.status !== 'ok' || !res.service || !res.service.port) {
        alert(`Could not start files service on ${host}: ${res?.reason || 'unknown error'}`);
        return;
      }

      const filesPort = Number(res.service.port);
      const filesPanel = state.panelEditor.panels.find((p) => p.label === 'Files');
      if (filesPanel) {
        filesPanel.port = filesPort;
        filesPanel.path = '/files';
        filesPanel.protocol = 'http';
      } else {
        state.panelEditor.panels.push({ label: 'Files', port: filesPort, path: '/files', protocol: 'http' });
      }

      renderPanelEditorRows();
      alert(`Files service started on ${host}:${filesPort} and wired into this session.`);
    }

    function savePanelEditor() {
      if (!state.panelEditor) return;
      const server = state.servers.find((s) => s.name === state.panelEditor.name);
      if (!server) return;
      server.panels = normalizePanels(state.panelEditor.panels);
      saveProfiles();
      closePanelModal();
      reloadServers(server.name);
    }

    async function refreshTmuxSessions(host) {
      const query = new URLSearchParams({ host: host || '127.0.0.1', port: '7000' }).toString();
      try {
        const payload = await fetch(`/tmux/sessions/proxy?${query}`).then((r) => r.json());
        state.tmuxSessions = Array.isArray(payload.sessions) ? payload.sessions : [];
        const header = payload.host || host || 'unknown';
        addNote.textContent = payload.error
          ? `Could not fetch tmux from ${header}: ${payload.error}`
          : `tmux sessions on ${header}: ${state.tmuxSessions.join(', ') || 'none'}`;
      } catch (err) {
        state.tmuxSessions = [];
        addNote.textContent = `Could not fetch tmux sessions: ${err.message}`;
      }
    }

    function fillTmuxOptions(defaultSession) {
      addExistingSession.innerHTML = '';
      const sessions = state.tmuxSessions.slice();
      for (const s of sessions) {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        addExistingSession.appendChild(opt);
      }
      if (!sessions.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '(no existing tmux sessions found)';
        addExistingSession.appendChild(opt);
      }
      addExistingSession.value = sessions.includes(defaultSession) ? defaultSession : (sessions[0] || '');
    }

    function updateSessionSourceVisibility() {
      const source = document.querySelector('input[name="tmux-source"]:checked')?.value || 'existing';
      if (source === 'existing' && !state.tmuxSessions.length) {
        document.querySelector('input[name="tmux-source"][value="new"]').checked = true;
      }
      const effective = document.querySelector('input[name="tmux-source"]:checked')?.value || 'new';
      const usingExisting = effective === 'existing' && state.tmuxSessions.length > 0;
      addExistingWrap.classList.toggle('hidden', !usingExisting);
      addNewSessionWrap.classList.toggle('hidden', usingExisting);
    }

    function updateServerChoiceVisibility() {
      const isNew = addServerSelect.value === '__new__';
      addNewServerWrap.classList.toggle('hidden', !isNew);
      addKnownServerWrap.classList.toggle('hidden', !isNew);
    }

    function updatePanelSourceVisibility() {
      const useProfile = addPanelSource.value === 'profile';
      addTemplateWrap.classList.toggle('hidden', useProfile);
      addSourceProfileWrap.classList.toggle('hidden', !useProfile);
    }

    function populateKnownServerOptions(defaultIp) {
      addKnownServer.innerHTML = '';
      const manual = document.createElement('option');
      manual.value = '';
      manual.textContent = 'Manual IP/host';
      addKnownServer.appendChild(manual);

      HOMELAB_SERVERS.forEach((server) => {
        const opt = document.createElement('option');
        opt.value = server.ip;
        opt.textContent = `${server.name} (${server.ip})`;
        addKnownServer.appendChild(opt);
      });

      const match = HOMELAB_SERVERS.find((s) => s.ip === defaultIp);
      addKnownServer.value = match ? match.ip : '';
    }

    async function populateServerChoices() {
      const current = state.servers.find((s) => s.name === state.activeServer) || state.servers[0];
      addServerSelect.innerHTML = '';
      addTemplateSelect.innerHTML = '';
      addPanelSource.innerHTML = '';
      addSourceProfile.innerHTML = '';

      const sourceTemplateOpt = document.createElement('option');
      sourceTemplateOpt.value = 'template';
      sourceTemplateOpt.textContent = 'Template';
      addPanelSource.appendChild(sourceTemplateOpt);

      const sourceProfileOpt = document.createElement('option');
      sourceProfileOpt.value = 'profile';
      sourceProfileOpt.textContent = 'Existing server profile';
      addPanelSource.appendChild(sourceProfileOpt);

      state.templates.forEach((tpl) => {
        const opt = document.createElement('option');
        opt.value = tpl.id;
        opt.textContent = tpl.label;
        addTemplateSelect.appendChild(opt);
      });

      state.servers.forEach((server) => {
        const resolved = profileNetworkHost(server) || server.ip || 'unknown-host';
        const text = `${displayName(server)} (${resolved})`;

        const opt = document.createElement('option');
        opt.value = server.name;
        opt.textContent = text;
        addServerSelect.appendChild(opt);

        const sourceOpt = document.createElement('option');
        sourceOpt.value = server.name;
        sourceOpt.textContent = text;
        addSourceProfile.appendChild(sourceOpt);

      });

      const newOpt = document.createElement('option');
      newOpt.value = '__new__';
      newOpt.textContent = '+ New server profile';
      addServerSelect.appendChild(newOpt);

      if (current) {
        const host = profileNetworkHost(current) || current.ip || '127.0.0.1';
        addServerSelect.value = current.name;
        addServerIp.value = host;
        addLabel.value = displayName(current);
        addSourceProfile.value = current.name;
        populateKnownServerOptions(host);
        await refreshTmuxSessions(host);
        const defaultSession = terminalSessionForServer(current);
        fillTmuxOptions(defaultSession);
        addNewSession.value = defaultSession === '1' ? 'job1' : `${defaultSession}-copy`;
      }

      if (addTemplateSelect.options.length) addTemplateSelect.value = addTemplateSelect.options[0].value;
      addPanelSource.value = 'profile';
      updatePanelSourceVisibility();

      updateServerChoiceVisibility();
      updateSessionSourceVisibility();
    }

    async function openAddModal() {
      if (!state.servers.length) return;
      await populateServerChoices();
      addModal.classList.add('open');
    }

    function closeAddModal() {
      addModal.classList.remove('open');
    }

    function selectedTmuxSession() {
      const source = document.querySelector('input[name="tmux-source"]:checked')?.value || 'existing';
      const raw = source === 'existing' ? addExistingSession.value : addNewSession.value;
      return sanitizeSessionName(raw);
    }

    async function submitAddModal() {
      const selected = addServerSelect.value;
      const isNew = selected === '__new__';
      const session = selectedTmuxSession();
      const label = (addLabel.value.trim() || 'session');
      const selectedTemplate = state.templates.find((t) => t.id === addTemplateSelect.value) || state.templates[0];
      const templatePanels = selectedTemplate ? normalizePanels(selectedTemplate.panels) : [];
      const panelSource = addPanelSource.value || 'profile';
      const sourceProfile = state.servers.find((s) => s.name === addSourceProfile.value) || state.servers[0];
      const profilePanels = sourceProfile ? normalizePanels(clonePanels(sourceProfile)) : [];

      let targetHost;
      let nameSeed = 'session';

      if (isNew) {
        targetHost = addServerIp.value.trim();
        if (!targetHost) {
          alert('Please set the server IP/host.');
          return;
        }
        nameSeed = label;
      } else {
        const selectedProfile = state.servers.find((s) => s.name === selected);
        if (!selectedProfile) return;
        targetHost = profileNetworkHost(selectedProfile) || selectedProfile.ip;
        nameSeed = selectedProfile.name;
      }

      const newProfile = {
        name: makeUniqueName(`${nameSeed}-${label}-${session}`),
        display: label,
        ip: targetHost,
        panels: panelSource === 'template' ? templatePanels : profilePanels,
      };
      if (!newProfile.panels.length) newProfile.panels = templatePanels;

      const remotePanels = await fetchServerPanels(targetHost);
      if (remotePanels && remotePanels.length) {
        newProfile.panels = remotePanels;
      }

      setTerminalSession(newProfile, session);

      state.servers.unshift(newProfile);
      saveProfiles();
      closeAddModal();
      reloadServers(newProfile.name);
    }

    let dragServerName = null;

    function clearDropMarkers() {
      document.querySelectorAll('.session-row.drop-before, .session-row.drop-after').forEach((el) => {
        el.classList.remove('drop-before', 'drop-after');
      });
      document.querySelectorAll('.session-row.dragging').forEach((el) => {
        el.classList.remove('dragging');
      });
    }

    function moveServerTo(dragName, targetName, after) {
      if (!dragName || !targetName || dragName === targetName) return;
      const fromIdx = state.servers.findIndex((s) => s.name === dragName);
      const targetIdx = state.servers.findIndex((s) => s.name === targetName);
      if (fromIdx < 0 || targetIdx < 0) return;

      const [item] = state.servers.splice(fromIdx, 1);
      let insertIdx = targetIdx;
      if (after) insertIdx += 1;
      if (fromIdx < targetIdx) insertIdx -= 1;
      state.servers.splice(insertIdx, 0, item);
      saveProfiles();
    }

    function renderSidebar() {
      const list = document.getElementById('server-list');
      list.innerHTML = '';

      state.servers.forEach((server) => {
        const row = document.createElement('div');
        row.className = 'session-row';

        row.addEventListener('dragover', (e) => {
          const source = dragServerName || e.dataTransfer.getData('text/plain');
          if (!source || source === server.name) return;
          e.preventDefault();
          const rect = row.getBoundingClientRect();
          const after = e.clientY > rect.top + rect.height / 2;
          row.classList.toggle('drop-before', !after);
          row.classList.toggle('drop-after', after);
        });

        row.addEventListener('dragleave', () => {
          row.classList.remove('drop-before', 'drop-after');
        });

        row.addEventListener('drop', (e) => {
          const source = dragServerName || e.dataTransfer.getData('text/plain');
          clearDropMarkers();
          if (!source || source === server.name) return;
          e.preventDefault();
          const rect = row.getBoundingClientRect();
          const after = e.clientY > rect.top + rect.height / 2;
          moveServerTo(source, server.name, after);
          renderSidebar();
        });

        const main = document.createElement('button');
        main.className = 'session-main' + (server.name === state.activeServer ? ' active' : '');
        main.onclick = () => selectServer(server);

        const dot = document.createElement('span');
        dot.className = 'session-dot';
        dot.style.background = colorForServer(server);

        const text = document.createElement('div');
        text.className = 'session-text';
        const label = document.createElement('div');
        label.className = 'session-label';
        label.textContent = displayName(server);
        const meta = document.createElement('div');
        meta.className = 'session-meta';
        meta.textContent = profileNetworkHost(server) || server.ip || 'unknown-host';
        text.appendChild(label);
        text.appendChild(meta);

        main.appendChild(dot);
        main.appendChild(text);

        const actions = document.createElement('div');
        actions.className = 'session-actions';

        const rename = document.createElement('button');
        rename.className = 'icon-btn';
        rename.textContent = 'R';
        rename.title = 'Rename session label';
        rename.onclick = (e) => { e.stopPropagation(); renameSession(server); };

        const setup = document.createElement('button');
        setup.className = 'icon-btn';
        setup.textContent = 'S';
        setup.title = 'Setup panels';
        setup.onclick = (e) => { e.stopPropagation(); openPanelModal(server); };

        const del = document.createElement('button');
        del.className = 'icon-btn';
        del.textContent = 'X';
        del.title = 'Delete session';
        del.onclick = (e) => { e.stopPropagation(); deleteSession(server); };

        const kill = document.createElement('button');
        kill.className = 'icon-btn';
        kill.textContent = '!';
        kill.title = 'Delete + kill tmux session';
        kill.onclick = (e) => { e.stopPropagation(); deleteSessionAndKill(server); };

        const drag = document.createElement('button');
        drag.className = 'icon-btn drag-handle';
        drag.textContent = '::';
        drag.title = 'Drag to reorder';
        drag.draggable = true;
        drag.ondragstart = (e) => {
          dragServerName = server.name;
          row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', server.name);
        };
        drag.ondragend = () => {
          dragServerName = null;
          clearDropMarkers();
        };

        actions.appendChild(rename);
        actions.appendChild(setup);
        actions.appendChild(del);
        actions.appendChild(kill);
        actions.appendChild(drag);

        row.appendChild(main);
        row.appendChild(actions);
        list.appendChild(row);
      });
    }

    function renderTabs(server) {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';

      if (!server.panels || server.panels.length === 0) {
        const addTabBtn = document.createElement('button');
        addTabBtn.id = 'add-tab-btn';
        addTabBtn.title = 'Add panel tab';
        addTabBtn.textContent = '+';
        addTabBtn.onclick = () => openPanelModal(server);
        tabs.appendChild(addTabBtn);
        delete state.activeTabByServer[server.name];
        saveUIState();
        activateFrame('');
        return;
      }

      const savedLabel = state.activeTabByServer[server.name];
      let selectedFrameId = null;
      let selectedLabel = null;

      server.panels.forEach((panel, i) => {
        const frame = ensureFrame(server, panel);
        const frameId = frame.id;
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        const dot = document.createElement('span');
        dot.className = 'tab-dot unknown';
        dot.title = 'Checking panel health...';
        const text = document.createElement('span');
        text.textContent = panel.label;
        btn.appendChild(dot);
        btn.appendChild(text);
        btn.onclick = () => {
          document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          state.activeTabByServer[server.name] = panel.label;
          saveUIState();
          activateFrame(frameId);
        };
        tabs.appendChild(btn);

        probePanelStatus(server, panel).then((status) => {
          dot.classList.remove('unknown', 'up', 'down');
          dot.classList.add(status.up ? 'up' : 'down');
          if (status.up) {
            dot.title = `${panel.label} up on ${status.host}:${panel.port} (${status.latency}ms)`;
          } else {
            dot.title = `${panel.label} down on ${status.host}:${panel.port}${status.error ? ` (${status.error})` : ''}`;
          }
        });

        if ((savedLabel && savedLabel === panel.label) || (!savedLabel && i === 0)) {
          selectedFrameId = frameId;
          selectedLabel = panel.label;
          btn.classList.add('active');
        }
      });

      if (!selectedFrameId) {
        selectedFrameId = frameIdFor(server, server.panels[0]);
        selectedLabel = server.panels[0].label;
      }

      const addTabBtn = document.createElement('button');
      addTabBtn.id = 'add-tab-btn';
      addTabBtn.title = 'Add panel tab';
      addTabBtn.textContent = '+';
      addTabBtn.onclick = () => openPanelModal(server);
      tabs.appendChild(addTabBtn);

      state.activeTabByServer[server.name] = selectedLabel;
      saveUIState();
      activateFrame(selectedFrameId);
    }

    async function init() {
      loadUIState();
      await loadSessionTemplates();
      await loadProfilesFromBootstrap();

      document.getElementById('add-session-btn').onclick = openAddModal;
      document.getElementById('add-cancel').onclick = closeAddModal;
      document.getElementById('add-submit').onclick = submitAddModal;
      document.getElementById('panel-cancel').onclick = closePanelModal;
      document.getElementById('panel-save').onclick = savePanelEditor;
      document.getElementById('panel-sync').onclick = syncPanelEditorFromRemote;
      document.getElementById('panel-launch-files').onclick = launchFilesServiceFromPanelEditor;
      document.getElementById('panel-add').onclick = () => {
        if (!state.panelEditor) return;
        state.panelEditor.panels.push({ label: 'Panel', port: 9000, path: '/', protocol: 'http' });
        renderPanelEditorRows();
      };

      addServerSelect.addEventListener('change', async () => {
        updateServerChoiceVisibility();
        if (addServerSelect.value !== '__new__') {
          const server = state.servers.find((s) => s.name === addServerSelect.value);
          if (server) {
            const host = profileNetworkHost(server) || server.ip || '127.0.0.1';
            addLabel.value = displayName(server);
            addSourceProfile.value = server.name;
            addServerIp.value = host;
            populateKnownServerOptions(host);
            await refreshTmuxSessions(host);
            fillTmuxOptions(terminalSessionForServer(server));
          }
        } else {
          const baseServer = state.servers.find((s) => s.name === state.activeServer) || state.servers[0];
          const suggestedHost = baseServer ? (profileNetworkHost(baseServer) || baseServer.ip || '') : '';
          addServerIp.value = suggestedHost;
          if (!addLabel.value.trim()) addLabel.value = baseServer ? displayName(baseServer) : '';
          populateKnownServerOptions(suggestedHost);
          await refreshTmuxSessions(suggestedHost || '127.0.0.1');
          fillTmuxOptions('1');
        }
        updateSessionSourceVisibility();
      });

      addPanelSource.addEventListener('change', updatePanelSourceVisibility);

      addKnownServer.addEventListener('change', async () => {
        if (addKnownServer.value) {
          addServerIp.value = addKnownServer.value;
          const match = HOMELAB_SERVERS.find((s) => s.ip === addKnownServer.value);
          if (match && !addLabel.value.trim()) addLabel.value = match.name;
          await refreshTmuxSessions(addKnownServer.value);
          fillTmuxOptions('1');
          updateSessionSourceVisibility();
        }
      });

      document.querySelectorAll('input[name="tmux-source"]').forEach((radio) => {
        radio.addEventListener('change', updateSessionSourceVisibility);
      });

      addModal.addEventListener('click', (e) => {
        if (e.target === addModal) closeAddModal();
      });
      panelModal.addEventListener('click', (e) => {
        if (e.target === panelModal) closePanelModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && addModal.classList.contains('open')) closeAddModal();
        if (e.key === 'Escape' && panelModal.classList.contains('open')) closePanelModal();
      });

      reloadServers(state.activeServer);
    }

    init();
  </script>
</body>
</html>
